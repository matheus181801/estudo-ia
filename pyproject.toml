[project]
name = "estudo-ia"
version = "0.1.0"
description = "Automação diária de estudos com RAG, bot no Telegram, podcast e vídeo"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[project.scripts]
estudo-ia = "estudo_ia:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
